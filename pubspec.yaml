name: teka_luxe
description: Premium T-Shirt e-commerce app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  connectivity_plus: ^7.1.1
  equatable: ^2.0.8
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  get_it: ^8.0.3
  go_router: ^17.2.2
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  lucide_icons: ^0.257.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.12.4

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/images/reset_password/

flutter_native_splash:
  color: "#F3EEE5"
  color_dark: "#F3EEE5"
  image: assets/images/logos/native_splash_luxe.png
  image_dark: assets/images/logos/native_splash_luxe.png
  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#F3EEE5"
    color_dark: "#F3EEE5"
    image: assets/images/logos/native_splash_luxe.png
    image_dark: assets/images/logos/native_splash_luxe.png
    icon_background_color: "#F3EEE5"
    icon_background_color_dark: "#F3EEE5"
