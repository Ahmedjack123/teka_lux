name: teka_luxe
description: Premium T-Shirt e-commerce app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.2
  cloud_firestore: ^6.3.0
  cloud_functions: ^6.2.0
  connectivity_plus: ^7.1.1
  dartz: ^0.10.1
  dio: ^5.9.2
  equatable: ^2.0.8
  firebase_analytics: ^12.3.0
  firebase_auth: ^6.4.0
  firebase_core: ^4.7.0
  firebase_crashlytics: ^5.2.0
  firebase_messaging: ^16.2.0
  firebase_storage: ^13.3.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_stripe: ^12.6.0
  flutter_svg: ^2.2.4
  form_builder_validators: ^11.3.0
  go_router: ^17.2.2
  google_fonts: ^8.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  logger: ^2.7.0
  lottie: ^3.3.3
  lucide_icons: ^0.257.0
  path_provider: ^2.1.5
  pay: ^3.3.0
  photo_view: ^0.15.0
  retrofit: ^4.9.2
  riverpod_annotation: ^4.0.2
  sentry_flutter: ^9.19.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.2
  mockito: ^5.6.4
  retrofit_generator: ^10.2.5

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logos/
    - assets/images/onboarding/
    - assets/icons/
    - assets/lottie/

flutter_native_splash:
  color: "#F3EEE5"
  color_dark: "#F3EEE5"
  image: assets/images/logos/native_splash_luxe.png
  image_dark: assets/images/logos/native_splash_luxe.png
  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#F3EEE5"
    color_dark: "#F3EEE5"
    image: assets/images/logos/native_splash_luxe.png
    image_dark: assets/images/logos/native_splash_luxe.png
    icon_background_color: "#F3EEE5"
    icon_background_color_dark: "#F3EEE5"
