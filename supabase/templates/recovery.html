<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="light dark" name="color-scheme" />
    <meta content="light dark" name="supported-color-schemes" />
    <title>Reset your Teka Luxe password</title>
    <style>
      @media only screen and (max-width: 600px) {
        .container {
          width: 100% !important;
        }

        .card {
          border-radius: 28px !important;
          padding: 34px 24px !important;
        }

        .title {
          font-size: 34px !important;
          line-height: 38px !important;
        }

        .body-copy {
          font-size: 15px !important;
          line-height: 25px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fafbff;
      color: #080a12;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        color: transparent;
      "
    >
      Reset your Teka Luxe password and get back to your account.
    </div>

    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #fafbff; border-collapse: collapse"
    >
      <tr>
        <td align="center" style="padding: 42px 18px">
          <table
            class="container"
            role="presentation"
            width="560"
            cellspacing="0"
            cellpadding="0"
            style="width: 560px; max-width: 560px; border-collapse: collapse"
          >
            <tr>
              <td align="center" style="padding: 0 0 22px">
                <div
                  style="
                    color: #315cff;
                    font-size: 13px;
                    font-weight: 800;
                    letter-spacing: 0.22em;
                    text-transform: uppercase;
                  "
                >
                  Teka Luxe
                </div>
              </td>
            </tr>

            <tr>
              <td
                class="card"
                style="
                  background: #ffffff;
                  border: 1px solid #d7dee9;
                  border-radius: 34px;
                  padding: 44px 40px;
                  box-shadow: 0 18px 42px rgba(49, 92, 255, 0.08);
                "
              >
                <table
                  role="presentation"
                  width="100%"
                  cellspacing="0"
                  cellpadding="0"
                  style="border-collapse: collapse"
                >
                  <tr>
                    <td align="center">
                      <div
                        style="
                          width: 82px;
                          height: 82px;
                          border-radius: 999px;
                          background: #eaf0ff;
                          border: 1px solid #cdd8ff;
                          color: #315cff;
                          font-size: 34px;
                          font-weight: 900;
                          line-height: 82px;
                          text-align: center;
                        "
                      >
                        ↺
                      </div>
                    </td>
                  </tr>

                  <tr>
                    <td align="center" style="padding-top: 28px">
                      <h1
                        class="title"
                        style="
                          margin: 0;
                          color: #080a12;
                          font-family: Georgia, 'Times New Roman', serif;
                          font-size: 42px;
                          line-height: 46px;
                          font-weight: 800;
                          letter-spacing: 0;
                        "
                      >
                        Reset Your Password
                      </h1>
                    </td>
                  </tr>

                  <tr>
                    <td align="center" style="padding-top: 18px">
                      <p
                        class="body-copy"
                        style="
                          margin: 0;
                          color: #323746;
                          font-size: 16px;
                          line-height: 27px;
                        "
                      >
                        We received a request to reset your password. Tap the
                        button below to choose a new password for your Teka Luxe
                        account.
                      </p>
                    </td>
                  </tr>

                  <tr>
                    <td align="center" style="padding-top: 32px">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="
                          display: inline-block;
                          min-width: 220px;
                          background: #315cff;
                          border-radius: 20px;
                          color: #ffffff;
                          font-size: 14px;
                          font-weight: 800;
                          letter-spacing: 0.08em;
                          line-height: 56px;
                          text-align: center;
                          text-decoration: none;
                          text-transform: uppercase;
                        "
                      >
                        Reset Password
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding: 22px 22px 0">
                <p
                  style="
                    margin: 0;
                    color: #71798a;
                    font-size: 12px;
                    line-height: 19px;
                  "
                >
                  If you did not request a password reset, you can ignore this
                  email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
