<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Reset your Teka Luxe password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #fafbff;
      color: #080a12;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="background: #fafbff; border-collapse: collapse"
    >
      <tr>
        <td align="center" style="padding: 42px 18px">
          <table
            role="presentation"
            width="560"
            cellspacing="0"
            cellpadding="0"
            style="width: 560px; max-width: 100%; border-collapse: collapse"
          >
            <tr>
              <td align="center" style="padding: 0 0 22px">
                <div
                  style="
                    color: #315cff;
                    font-size: 13px;
                    font-weight: 800;
                    letter-spacing: 0.22em;
                    text-transform: uppercase;
                  "
                >
                  Teka Luxe
                </div>
              </td>
            </tr>
            <tr>
              <td
                style="
                  background: #ffffff;
                  border: 1px solid #d7dee9;
                  border-radius: 34px;
                  padding: 44px 40px;
                  box-shadow: 0 18px 42px rgba(49, 92, 255, 0.08);
                  text-align: center;
                "
              >
                <h1
                  style="
                    margin: 0;
                    color: #080a12;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 42px;
                    line-height: 46px;
                    font-weight: 800;
                  "
                >
                  Reset Your Password
                </h1>
                <p
                  style="
                    margin: 18px 0 0;
                    color: #323746;
                    font-size: 16px;
                    line-height: 27px;
                  "
                >
                  We received a password reset request for %EMAIL%. Tap the
                  button below to choose a new password.
                </p>
                <a
                  href="%LINK%"
                  style="
                    display: inline-block;
                    min-width: 220px;
                    margin-top: 32px;
                    background: #315cff;
                    border-radius: 20px;
                    color: #ffffff;
                    font-size: 14px;
                    font-weight: 800;
                    letter-spacing: 0.08em;
                    line-height: 56px;
                    text-align: center;
                    text-decoration: none;
                    text-transform: uppercase;
                  "
                >
                  Reset Password
                </a>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 22px 22px 0">
                <p
                  style="
                    margin: 0;
                    color: #71798a;
                    font-size: 12px;
                    line-height: 19px;
                  "
                >
                  If you did not request a password reset, you can ignore this
                  email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
